<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121316">
<link rel="icon" type="image/png" sizes="32x32" href="marca/nc-icone-32.png">
<link rel="icon" type="image/svg+xml" href="marca/nc-icone.svg">
<link rel="apple-touch-icon" href="marca/nc-icone-180.png">
<title>Negócios Creators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho com a marca nc + busca/filtros em pílula; cada negócio é um bloco com a cor da marca e uma grade de atalhos. */
:root{
  --bg:#F3EBDF; --surface:#FFFFFF; --ink:#5A3A2E; --muted:#8A6E60; --line:#E2D5C3;
  --mint:#C8603A; --orange:#B0831F; --spark:#F3EBDF; --chip:#EADFCF;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Bricolage Grotesque",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#241913; --surface:#33241C; --ink:#F3EBDF; --muted:#CBB6A6; --line:#4E392E;
  --mint:#E07B52; --orange:#D9AE4A; --spark:#F3EBDF; --chip:#402E25; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#241913; --surface:#33241C; --ink:#F3EBDF; --muted:#CBB6A6; --line:#4E392E;
  --mint:#E07B52; --orange:#D9AE4A; --spark:#F3EBDF; --chip:#402E25; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:10px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap>*{min-width:0}

/* Cabeçalho */
.topo{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.selo{width:76px;height:76px;border-radius:20px;background:#121316;display:grid;place-items:center;box-shadow:0 14px 34px rgba(17,18,21,.22);overflow:hidden;position:relative}
.selo::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 100% 100%,rgba(255,143,74,.30),transparent 55%),radial-gradient(90% 90% at 0 0,rgba(62,221,176,.12),transparent 60%)}
.selo svg{width:52px;position:relative;z-index:1}
.nome{display:grid;gap:2px;min-width:0}
.nome .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nome h1{font-size:clamp(1.5rem,4.2vw,2.2rem);font-weight:800;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
.nome h1 .c{color:var(--orange)}
.nome p{color:var(--muted);font-size:.95rem}

/* Barra de busca e filtros */
.ferramentas{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-block:-10px}
.busca{flex:1 1 240px;min-width:0;position:relative}
.busca input{width:100%;padding:11px 16px 11px 40px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600}
.busca input:focus{outline:none;border-color:var(--ink)}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2}
.filtros{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;min-width:0;max-width:100%;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filtro{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filtro span{font-family:var(--mono);font-weight:500;opacity:.6;margin-left:4px;font-size:.78rem}

/* Atalhos por negócio */
.indice{display:flex;flex-wrap:wrap;gap:6px}
.indice a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:700;font-size:.85rem;padding:6px 12px 6px 8px;border-radius:999px;background:var(--chip)}
.indice a i{width:10px;height:10px;border-radius:50%;background:var(--cor)}

.negocio{display:grid;gap:12px;scroll-margin-top:84px}
.neg-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.neg-cab h2{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:800;letter-spacing:-.025em}
.neg-cab h2 i{width:14px;height:14px;border-radius:50%;background:var(--cor);box-shadow:0 0 0 4px color-mix(in srgb,var(--cor) 22%,transparent)}
.neg-cab p{color:var(--muted);font-size:.88rem;min-width:0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.link{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:13px 14px 12px;transition:border-color .15s,transform .15s}
.link:hover{border-color:var(--cor);transform:translateY(-1px)}
.link b{font-size:.98rem;font-weight:800;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.link .seta{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);grid-row:span 2}
.link .seta svg{width:13px;height:13px;stroke:var(--ink);fill:none;stroke-width:2.4}
.link:hover .seta{background:var(--cor)}
.link:hover .seta svg{stroke:#fff}
.link small{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.78rem;min-width:0}
.link small code{font-family:var(--mono);font-size:.74rem;overflow-wrap:anywhere;min-width:0}
.tipo{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.tipo.privado::before{content:"🔒 ";font-size:.62rem}
.vazio{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}
.rodape{color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:520px){.selo{width:60px;height:60px;border-radius:16px}.selo svg{width:42px}}
@media (prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="topo">
    <div class="selo" aria-hidden="true">
      <img src="https://negocioscreators.com/marca/nc-simbolo-creme.svg" alt="nc" style="height:28px;width:auto;display:block">
    </div>
    <div class="nome">
      <span class="eyebrow">Ecossistema Luana Caper</span>
      <h1>Negócios <span class="c">Creators</span></h1>
      <p>Todos os painéis, páginas e ferramentas das marcas e criadores num lugar só.</p>
    </div>
  </header>

  <div class="ferramentas">
    <label class="busca" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar</span>
      <input id="q" type="search" placeholder="Buscar: criadores, LP, calendário, Aimê…" autocomplete="off">
    </label>
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por tipo"></div>
  </div>

  <nav class="indice" id="indice" aria-label="Negócios"></nav>
  <main id="lista" style="display:grid;grid-template-columns:minmax(0,1fr);gap:30px"></main>

  <footer class="rodape">
    <span id="contagem"></span>
    <span>🔒 = pede login ou é visível só pra você</span>
  </footer>
</div>

<script>
/* Para acrescentar um link: ache o negócio abaixo e inclua uma linha { t, u, k }.
   k = painel | criadores | lp | trafego | calendario | site | ferramenta. priv: true = pede login / só você vê. h = texto curto no lugar do endereço. */
const NEGOCIOS = [
  { id: "luana", nome: "Luana Caper Creators", cor: "#E2762F", sobre: "Portfólio UGC, marca pessoal @luhcaper e marcas parceiras", links: [
    { t: "Portfólio UGC", u: "https://luanacaper.github.io/portfolio-ugc/", k: "site" },
    { t: "Painel do portfólio", u: "https://luanacaper.github.io/portfolio-ugc/login/", k: "painel", priv: true, d: "Vídeos, marcas, métricas, calendário e campanhas" },
    { t: "Bio link @luhcaper", u: "https://pousadaaime.github.io/luhcaper/", k: "site" },
    { t: "Instagram @luhcaper", u: "https://www.instagram.com/luhcaper", k: "site" }
  ]},
  { id: "aime", nome: "Pousada Aimê", cor: "#48B29A", sobre: "Hospedagem, aniversários e agências", links: [
    { t: "Painel Aimê", u: "https://claude.ai/artifact/UURBig6bJT4y9FAcJEeEDq", k: "painel", priv: true },
    { t: "Calendário de outubro", u: "https://pousadaaime.github.io/calendario/2026-10.html", k: "calendario" },
    { t: "Painel de criadores", u: "https://pousadaaime.github.io/aime-criadores/painel-criadores.html", k: "criadores", priv: true },
    { t: "Inscrição de criadores", u: "https://pousadaaime.github.io/aime-criadores/", k: "criadores" },
    { t: "Termo de criadores", u: "https://pousadaaime.github.io/aime-criadores/termo.html", k: "criadores" },
    { t: "LP Hospedagem", u: "https://pousadaaime.github.io/aime-lp-hospedagem/", k: "lp" },
    { t: "LP Aniversários", u: "https://pousadaaime.github.io/aime-lp-aniversario/", k: "lp" },
    { t: "LP Agências", u: "https://pousadaaime.github.io/aime-lp-agencia/", k: "lp" },
    { t: "Painel de reservas", u: "https://clientes-aime.netlify.app/", k: "painel", priv: true }
  ]},
  { id: "fast", nome: "Fast Escova", cor: "#D9467A", sobre: "Unidade Bauru: creators locais e cupom", links: [
    { t: "Calendário", u: "https://fastescovabauru.github.io/calendario/", k: "calendario" },
    { t: "Calendário de outubro", u: "https://fastescovabauru.github.io/calendario/2026-10.html", k: "calendario" },
    { t: "Painel de criadores", u: "https://fastescovabauru.github.io/criadores/painelcriadores.html", k: "criadores", priv: true },
    { t: "Inscrição de criadores", u: "https://fastescovabauru.github.io/criadores/", k: "criadores" },
    { t: "Termo de criadores", u: "https://fastescovabauru.github.io/criadores/termo.html", k: "criadores" },
    { t: "LP Cupom Bauru", u: "https://fastescovabauru.github.io/cupom/", k: "lp" },
    { t: "Admin do cupom", u: "https://fastescovabauru.github.io/cupom/admin.html", k: "painel", priv: true },
    { t: "Importar vendas", u: "https://fastescovabauru.github.io/cupom/importar-vendas.html", k: "ferramenta", priv: true },
    { t: "Dashboard Fast Escova", u: "https://claude.ai/artifact/WfEhAWMf2GAFL61atd1fCQ", k: "painel", priv: true },
    { t: "Métricas Gerenciador de anúncio (todo o período)", u: "https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=1350229950256362&business_id=1452963213180476&nav_entry_point=ads_ecosystem_navigation_menu&nav_source=ads_manager&treenav=true&date=2026-05-20_2026-10-04%2Cmaximum&insights_date=2026-05-20_2026-10-04%2Cmaximum", k: "trafego", priv: true, h: "Meta Ads · máximo" },
    { t: "Pagamento da conta de anúncios", u: "https://adsmanager.facebook.com/adsmanager/billing_hub/accounts/details/?global_scope_id=1452963213180476&business_id=1452963213180476&asset_id=120247858992730161&placement=ads_manager&scope_sel=1&payment_account_id=1350229950256362", k: "trafego", priv: true, h: "Meta Ads · cobrança" }
  ]},
  { id: "hfcon", nome: "HF Consultoria", cor: "#2F5D9E", sobre: "Contabilidade e restituição previdenciária", links: [
    { t: "Site", u: "https://hfconsultoriacontabil.com.br", k: "site" },
    { t: "LP Restituição previdenciária", u: "https://hfconsultoriacontabil.com.br/restituicao-previdenciaria", k: "lp" },
    { t: "Métricas Gerenciador de anúncio (hoje)", u: "https://adsmanager.facebook.com/adsmanager/manage/adsets?act=3297675240516902&business_id=665430697933403&date=2026-10-05_2026-10-06%2Ctoday&global_scope_id=665430697933403&insights_date=2026-10-05_2026-10-06%2Ctoday&nav_entry_point=am_global_scope_selector&treenav=true&column_preset=28648544321431391", k: "trafego", priv: true, h: "Meta Ads · hoje" }
  ]},
  { id: "hfcred", nome: "HF Créditos", cor: "#B8892B", sobre: "Precatórios e RPV", links: [
    { t: "Site", u: "https://hfcreditos.com.br", k: "site" },
    { t: "LP Precatório e RPV", u: "https://hfcreditos.com.br/lp-precatorio-rpv-v2", k: "lp" },
    { t: "Métricas Gerenciador de anúncio (hoje)", u: "https://adsmanager.facebook.com/adsmanager/manage/adsets?act=748144001343797&business_id=2656914047882316&column_preset=28648437624775394&date=2026-07-09_2026-07-10%2Ctoday&insights_date=2026-07-09_2026-07-10%2Ctoday&nav_source=flyout_menu&treenav=true", k: "trafego", priv: true, h: "Meta Ads · hoje" },
    { t: "Pagamento da conta de anúncios", u: "https://adsmanager.facebook.com/adsmanager/billing_hub/accounts/details?nav_entry_point=ads_ecosystem_navigation_menu&placement=ads_manager&asset_id=748144001343797&business_id=2656914047882316&payment_account_id=748144001343797", k: "trafego", priv: true, h: "Meta Ads · cobrança" },
    { t: "Painel HF Créditos", u: "https://claude.ai/artifact/7eXcaUxdsDbDiUzzz5Kdxw", k: "painel", priv: true },
    { t: "Diagnóstico HF Créditos", u: "https://claude.ai/artifact/WKmyEk4ojieHonr8m2hV39", k: "painel", priv: true }
  ]},
  { id: "voo", nome: "Indeniza Voo", cor: "#3B8FD6", sobre: "Stabille e Pessoa Advogados", links: [
    { t: "Site Stabille e Pessoa", u: "https://sepadv.com.br", k: "site" },
    { t: "Política de privacidade", u: "https://claude.ai/artifact/4JeB5UE1ZZmx8Ecz5GhJXR", k: "site" },
    { t: "Métricas Gerenciador de anúncio (hoje)", u: "https://adsmanager.facebook.com/adsmanager/manage/adsets?act=2144035293209039&attribution_windows=default&business_id=1690648767715142&columns=name%2Cdelivery%2Crecommendations_guidance%2Cresults%2Ccost_per_result%2Cbudget%2Cspend%2Cimpressions%2Creach%2Cfrequency%2Ccpm%2Cactions%3Alink_click%2Cschedule%2Cend_time%2Cattribution_setting%2Cbid%2Clast_significant_edit%2Cquality_score_organic%2Cquality_score_ectr%2Cquality_score_ecvr%2Ccampaign_name&date=2026-09-10_2026-09-11%2Ctoday&global_scope_id=1690648767715142&insights_date=2026-09-10_2026-09-11%2Ctoday&nav_entry_point=am_global_scope_selector&treenav=true", k: "trafego", priv: true, h: "Meta Ads · hoje" },
    { t: "Pagamento da conta de anúncios", u: "https://adsmanager.facebook.com/adsmanager/billing_hub/accounts/details/?global_scope_id=1690648767715142&business_id=1690648767715142&asset_id=120251061465320744&placement=ads_manager&scope_sel=1&payment_account_id=2144035293209039", k: "trafego", priv: true, h: "Meta Ads · cobrança" }
  ]},
  { id: "fin", nome: "Meu Financeiro", cor: "#1FB88F", sobre: "Contas da casa e do negócio", links: [
    { t: "App Meu Financeiro", u: "https://luanacaper.github.io/meu-financeiro/", k: "painel", priv: true },
    { t: "Cobranças da agência", u: "https://luanacaper.github.io/negocios-creators/cobrancas.html", k: "painel", priv: true, h: "emails de vencimento" },
    { t: "Raio-X Financeiro", u: "https://claude.ai/artifact/AdX8Fg38198DDi8bGEqcsk", k: "painel", priv: true }
  ]}
];
const TIPOS = { todos: "Tudo", painel: "Painéis", criadores: "Criadores", lp: "LPs", trafego: "Tráfego", calendario: "Calendários", site: "Sites", ferramenta: "Ferramentas" };
const ROTULO = { painel: "Painel", criadores: "Criadores", lp: "LP", trafego: "Tráfego", calendario: "Calendário", site: "Site", ferramenta: "Ferramenta" };

let filtro = "todos";
try { const f = localStorage.getItem("nc-filtro"); if (f && TIPOS[f]) filtro = f; } catch (e) {}
const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const host = u => u.replace(/^https?:\/\//, "").replace(/\/$/, "");
const SETA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';

function desenharFiltros() {
  const cont = { todos: 0 };
  NEGOCIOS.forEach(n => n.links.forEach(l => { cont.todos++; cont[l.k] = (cont[l.k] || 0) + 1; }));
  $("filtros").innerHTML = Object.keys(TIPOS).filter(k => cont[k]).map(k =>
    `<button class="filtro" type="button" data-k="${k}" aria-pressed="${filtro === k}">${TIPOS[k]}<span>${cont[k]}</span></button>`).join("");
}
function desenhar() {
  const q = norm($("q").value.trim());
  let total = 0, negs = 0;
  const html = NEGOCIOS.map(n => {
    const itens = n.links.filter(l => (filtro === "todos" || l.k === filtro) &&
      (!q || norm(n.nome + " " + l.t + " " + (l.d || "") + " " + ROTULO[l.k] + " " + l.u).includes(q)));
    if (!itens.length) return "";
    total += itens.length; negs++;
    return `<section class="negocio" id="${n.id}" style="--cor:${n.cor}">
      <div class="neg-cab"><h2><i></i>${esc(n.nome)}</h2><p>${esc(n.sobre)}</p></div>
      <div class="grade">${itens.map(l => `<a class="link" href="${esc(l.u)}" target="_blank" rel="noopener">
        <b>${esc(l.t)}</b><span class="seta">${SETA}</span>
        <small><span class="tipo${l.priv ? " privado" : ""}">${ROTULO[l.k]}</span><code>${esc(l.h || host(l.u))}</code></small></a>`).join("")}</div>
    </section>`;
  }).join("");
  $("lista").innerHTML = html || `<p class="vazio">Nada encontrado com esse filtro. Tente outra palavra ou volte pra “Tudo”.</p>`;
  $("indice").innerHTML = NEGOCIOS.map(n => `<a href="#${n.id}" style="--cor:${n.cor}"><i></i>${esc(n.nome)}</a>`).join("");
  $("contagem").textContent = `${negs} ${negs === 1 ? "negócio" : "negócios"} · ${total} ${total === 1 ? "link" : "links"}`;
}
$("filtros").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.k;
  try { localStorage.setItem("nc-filtro", filtro); } catch (err) {}
  desenharFiltros(); desenhar();
});
$("q").addEventListener("input", desenhar);
desenharFiltros(); desenhar();
</script>

</body>
</html>
